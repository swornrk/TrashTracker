openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waste-detection
    description: AI-powered waste image classification
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waste-detection:
    post:
      operationId: detectWaste
      tags: [waste-detection]
      summary: Classify a waste image with Gemini
      description: Analyzes one uploaded waste image and returns Kathmandu-specific sorting and value guidance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WasteDetectionRequest"
      responses:
        "200":
          description: Waste classification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteDetectionResponse"
        "400":
          description: Invalid image payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WasteDetectionRequest:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
          minLength: 1
      required:
        - imageBase64
        - mimeType
    WasteDetectionResponse:
      type: object
      properties:
        detectedItem:
          type: string
        category:
          type: string
          enum: [Organic, Recyclable, Hazardous]
        confidencePercent:
          type: number
          minimum: 0
          maximum: 100
        marketValueNpr:
          type: string
        segregationAdvice:
          type: string
      required:
        - detectedItem
        - category
        - confidencePercent
        - marketValueNpr
        - segregationAdvice
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

